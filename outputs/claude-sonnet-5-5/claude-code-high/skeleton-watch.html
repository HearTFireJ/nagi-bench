<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AETERNA · Calibre AX-07 镂空机械表 — 交互式 3D 展示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#d9bb8c; --gold2:#f4e4c4; --ink:#ece8df; --dim:#8f8b83; --faint:#5d5a55;
  --panel:rgba(13,14,17,.66); --line:rgba(217,187,140,.22); --line2:rgba(255,255,255,.07);
  --hl:#5cc8ff;
  --serif:"Cormorant Garamond","Songti SC","Noto Serif SC","STSong",Georgia,serif;
  --sans:"Inter","PingFang SC","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#06070a;color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0}
#app canvas{display:block;outline:none;touch-action:none}
#vignette{position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(ellipse 75% 70% at 46% 46%,transparent 40%,rgba(0,0,0,.62) 100%),
  linear-gradient(180deg,rgba(0,0,0,.45) 0,transparent 16%,transparent 80%,rgba(0,0,0,.55) 100%)}
#leaders{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#leaders path{fill:none;stroke:rgba(217,187,140,.55);stroke-width:1}
#leaders path.hot{stroke:var(--hl);stroke-width:1.4}
#leaders circle{fill:var(--gold);stroke:rgba(0,0,0,.6);stroke-width:1}
#leaders circle.hot{fill:var(--hl)}
.lbl{position:fixed;left:0;top:0;z-index:4;font-size:11px;letter-spacing:.04em;padding:4px 9px 4px;border:1px solid var(--line);
  background:rgba(9,10,12,.74);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap;cursor:pointer;
  border-radius:2px;opacity:0;pointer-events:none;transition:opacity .35s,border-color .2s,background .2s;will-change:transform}
.lbl.show{opacity:1;pointer-events:auto}
.lbl b{font-weight:500;color:var(--gold2)}
.lbl i{font-family:var(--serif);font-style:italic;color:var(--dim);margin-left:6px;font-size:12px}
.lbl:hover,.lbl.hot{border-color:var(--hl);background:rgba(12,26,36,.85)}
.lbl.sel{border-color:#ffb84a;background:rgba(40,28,10,.85)}
#brand{position:fixed;left:34px;top:28px;z-index:5;pointer-events:none}
#brand .mark{font-family:var(--serif);font-size:30px;letter-spacing:.42em;font-weight:500;color:var(--gold2);text-shadow:0 2px 24px rgba(0,0,0,.8)}
#brand .sub{margin-top:6px;font-size:10px;letter-spacing:.32em;color:var(--dim);text-transform:uppercase}
#brand .rule{width:54px;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:12px}
#hint{position:fixed;left:34px;bottom:26px;z-index:5;font-size:11px;color:var(--faint);letter-spacing:.06em;line-height:1.9;pointer-events:none}
#hint b{color:var(--dim);font-weight:500}
#tip{position:fixed;z-index:8;pointer-events:none;padding:7px 12px;border:1px solid var(--line);background:rgba(8,9,11,.85);backdrop-filter:blur(10px);
  font-size:12px;border-radius:2px;transform:translate(16px,16px);opacity:0;transition:opacity .15s;white-space:nowrap}
#tip.on{opacity:1}
#tip b{color:var(--gold2);font-weight:500}
#tip i{display:block;font-family:var(--serif);font-size:13px;color:var(--dim)}
/* dock */
#dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:6;display:flex;gap:6px;align-items:center;padding:7px;
  background:var(--panel);border:1px solid var(--line2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);max-width:calc(100vw - 24px);flex-wrap:wrap;justify-content:center}
#dock .sep{width:1px;height:26px;background:var(--line2);margin:0 4px}
.btn{font:500 12px/1 var(--sans);letter-spacing:.05em;color:var(--ink);background:transparent;border:1px solid transparent;padding:10px 13px;border-radius:9px;cursor:pointer;
  display:flex;align-items:center;gap:7px;transition:all .2s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.06)}
.btn.on{background:linear-gradient(180deg,rgba(217,187,140,.22),rgba(217,187,140,.08));border-color:var(--line);color:var(--gold2)}
.btn kbd{font:500 9px var(--sans);color:var(--faint);border:1px solid var(--line2);border-radius:3px;padding:2px 4px}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.25);cursor:pointer;position:relative;transition:transform .2s}
.sw:hover{transform:scale(1.15)}
.sw.on{outline:1px solid var(--gold2);outline-offset:3px}
/* panel */
#panel{position:fixed;right:22px;top:22px;bottom:96px;width:338px;z-index:5;background:var(--panel);border:1px solid var(--line2);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:16px;overflow:hidden auto;box-shadow:0 30px 80px rgba(0,0,0,.6);
  transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s;scrollbar-width:thin;scrollbar-color:#3a3833 transparent}
#panel.hide{transform:translateX(calc(100% + 40px));opacity:0;pointer-events:none}
#panel section{padding:16px 20px;border-bottom:1px solid var(--line2)}
#panel section:last-child{border-bottom:0}
.eyebrow{font-size:9px;letter-spacing:.38em;color:var(--gold);text-transform:uppercase}
#panel h2{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:.06em;margin-top:6px;color:var(--gold2)}
#panel h2 small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.2em;color:var(--dim);font-weight:400;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.kv{font-size:10px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.kv span{display:block;font-size:14px;letter-spacing:.02em;color:var(--ink);text-transform:none;margin-top:3px;font-weight:400}
.gauge{margin-top:12px}
.gauge .row{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);letter-spacing:.06em}
.gauge .row b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:6px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a6d3f,var(--gold2));border-radius:2px}
#clock{font-family:var(--serif);font-size:34px;letter-spacing:.08em;color:var(--gold2);font-variant-numeric:tabular-nums;margin-top:2px}
#clock small{font-size:13px;color:var(--dim);letter-spacing:.2em;margin-left:8px}
#card .empty{font-size:12px;color:var(--faint);line-height:1.8}
#card h3{font-family:var(--serif);font-size:24px;font-weight:500;color:var(--gold2);letter-spacing:.03em}
#card h3 i{display:block;font-size:14px;color:var(--dim);font-weight:400;margin-top:2px}
#card .mat{display:inline-block;margin:10px 0 8px;font-size:10px;letter-spacing:.14em;padding:4px 9px;border:1px solid var(--line);color:var(--gold);border-radius:20px}
#card p{font-size:12.5px;line-height:1.85;color:#c9c5bc}
#card .specs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
#card .foc{margin-top:14px;display:flex;gap:8px}
.chip{font:500 11px var(--sans);letter-spacing:.06em;color:var(--dim);background:transparent;border:1px solid var(--line2);padding:6px 10px;border-radius:20px;cursor:pointer;transition:all .18s}
.chip:hover,.chip.hot{color:var(--ink);border-color:var(--hl);background:rgba(92,200,255,.08)}
.chip.sel{color:#ffd591;border-color:#ffb84a;background:rgba(255,184,74,.1)}
#plist{display:flex;flex-wrap:wrap;gap:6px}
#ptoggle{position:fixed;right:22px;top:22px;z-index:7;width:38px;height:38px;border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--gold2);
  font:italic 500 18px var(--serif);cursor:pointer;backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center}
#ptoggle.show{display:flex}
#pclose{position:absolute;right:14px;top:14px;background:none;border:0;color:var(--dim);cursor:pointer;font-size:18px;z-index:2}
/* loader */
#loader{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 45%,#12141a 0,#050608 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 1.2s ease .1s,visibility 1.3s;gap:22px}
#loader.done{opacity:0;visibility:hidden;pointer-events:none}
#loader .g{width:86px;height:86px;animation:spin 6s linear infinite}
#loader .g2{animation-direction:reverse;animation-duration:3.4s}
#loader .t{font-family:var(--serif);letter-spacing:.5em;font-size:22px;color:var(--gold2);padding-left:.5em}
#loader .m{font-size:11px;letter-spacing:.28em;color:var(--dim)}
#loader .p{width:180px;height:1px;background:rgba(255,255,255,.1);overflow:hidden}
#loader .p i{display:block;height:100%;width:30%;background:var(--gold);animation:slide 1.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(420%)}}
@media (max-width:900px){#panel{width:min(338px,calc(100vw - 30px));bottom:auto;max-height:46vh;top:auto;bottom:150px}#brand .mark{font-size:22px}#hint{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<svg id="leaders"></svg>
<div id="labels"></div>

<div id="brand"><div class="mark">AETERNA</div><div class="sub">Calibre AX-07 · Openworked Manual-Wind</div><div class="rule"></div></div>
<div id="hint"><b>拖动</b> 旋转 &nbsp;·&nbsp; <b>滚轮</b> 缩放 &nbsp;·&nbsp; <b>右键</b> 平移<br><b>悬停</b> 高亮零件 &nbsp;·&nbsp; <b>点击</b> 查看详情</div>
<div id="tip"></div>

<button id="ptoggle" title="机芯信息">i</button>
<aside id="panel">
  <button id="pclose" title="收起">×</button>
  <section>
    <div class="eyebrow">Calibre</div>
    <h2>AX-07<small>镂空手动上链机芯</small></h2>
  </section>
  <section>
    <div class="grid" id="specs"></div>
  </section>

    <div class="eyebrow">实时运转 · Live</div>

    <div class="gauge"><div class="row"><span>擒纵轮转速</span><b id="gEsc">—</b></div><div class="bar"><i id="bEsc"></i></div></div>
  </section>
  <section id="card"></section>
  <section>
    <div class="eyebrow" style="margin-bottom:12px">零件索引 · Components</div>
    <div id="plist"></div>
  </section>
</aside>

<div id="dock">
  <button class="btn" id="bExplode"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M4 8l3 2M20 8l-3 2M4 16l3-2M20 16l-3-2"/><rect x="8" y="9" width="8" height="6" rx="1.5"/></svg>爆炸视图<kbd>E</kbd></button>
  <button class="btn" id="bLabels"><svg viewBox="0 0 24 24"><path d="M4 7h9M4 12h6M4 17h9"/><circle cx="18" cy="7" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="18" cy="17" r="1.6"/></svg>标签<kbd>L</kbd></button>
  <button class="btn" id="bSpin"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.7-6"/><path d="M20 4v4h-4"/></svg>自动旋转<kbd>R</kbd></button>
  <div class="sep"></div>
  <button class="btn" id="bNight"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>夜光<kbd>N</kbd></button>
  <button class="btn" id="bSpeed"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 13l4-4M9 3h6"/></svg><span id="speedTxt">机芯 0.5×</span><kbd>S</kbd></button>
  <button class="btn" id="bWarp"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg><span id="warpTxt">时间 ×1</span><kbd>T</kbd></button>
  <button class="btn" id="bWind"><svg viewBox="0 0 24 24"><path d="M9 4h6M12 4v4"/><circle cx="12" cy="14" r="6"/><path d="M12 11v3h3"/></svg>上链<kbd>W</kbd></button>
  <div class="sep"></div>
  <button class="btn" data-view="front">正面</button>
  <button class="btn" data-view="iso">45°</button>
  <button class="btn" data-view="side">侧面</button>
  <button class="btn" data-view="back">机芯背面</button>
  <div class="sep"></div>
  <div id="themes" style="display:flex;gap:9px;padding:0 6px"></div>
</div>

<div id="loader">
  <svg class="g" viewBox="0 0 100 100" fill="none" stroke="#d9bb8c" stroke-width="1.2">
    <circle cx="50" cy="50" r="30"/><circle cx="50" cy="50" r="8"/>
    <g stroke-width="5" stroke-dasharray="3.6 3.4"><circle cx="50" cy="50" r="38"/></g>
    <path d="M50 20v22M50 58v22M20 50h22M58 50h22M29 29l16 16M55 55l16 16M71 29L55 45M45 55L29 71"/>
  </svg>
  <div class="t">AETERNA</div>
  <div class="p"><i></i></div>
  <div class="m" id="loadmsg">正在装配机芯…</div>
</div>

/* ════════════════════════════════════════════════════════════════════
   工具函数
   ════════════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const easeIO = x => { x = clamp(x, 0, 1); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOut = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const $ = s => document.querySelector(s);
const pol = (r, deg) => [r * Math.cos(deg * PI / 180), r * Math.sin(deg * PI / 180)];
const addv = (p, q) => [p[0] + q[0], p[1] + q[1]];

const shadowed = (m, cast = true, recv = true) => { m.castShadow = cast; m.receiveShadow = recv; return m; };

function shapeFromPts(pts) {
  const s = new THREE.Shape();
  s.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]);
  s.closePath();
  return s;
}
function pathFromPts(pts) {
  const p = new THREE.Path();
  p.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]);
  p.closePath();
  return p;
}
function circlePts(r, n = 48, cx = 0, cy = 0) {
  const a = [];
  for (let i = 0; i < n; i++) { const t = i / n * TAU; a.push([cx + r * Math.cos(t), cy + r * Math.sin(t)]); }
  return a;
}
/** Chaikin 角切割：把粗多边形平滑成有机圆润轮廓 */
function chaikin(pts, it = 2) {
  for (let k = 0; k < it; k++) {
    const out = [], n = pts.length;
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      out.push([a[0] * .75 + b[0] * .25, a[1] * .75 + b[1] * .25], [a[0] * .25 + b[0] * .75, a[1] * .25 + b[1] * .75]);
    }
    pts = out;
  }
  return pts;
}
/** 带倒角的挤出网格：几何体精确占据 z0..z1（含倒角） */
function mkExtrude(outerPts, holes, z0, z1, mat, bevel = 0.04) {
  const shape = shapeFromPts(outerPts);
  if (holes) for (const h of holes) shape.holes.push(pathFromPts(h));
  const depth = Math.max(0.02, (z1 - z0) - 2 * bevel);
  const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 1, curveSegments: 1, steps: 1 });
  const m = new THREE.Mesh(geo, mat);
  m.position.z = z0 + (bevel > 0 ? bevel : 0);
  return shadowed(m);
}
/** 沿 Z 轴的圆柱 */
function cylZ(r, z0, z1, mat, seg = 28, r2 = null) {
  const g = new THREE.CylinderGeometry(r2 ?? r, r, z1 - z0, seg, 1);
  g.rotateX(PI / 2); g.translate(0, 0, (z0 + z1) / 2);
  return shadowed(new THREE.Mesh(g, mat));
}
/** 车削体：profile 为 [半径, z]，绕 Z 轴，带折痕法线 */
function latheZ(profile, seg = 128, crease = 0.5) {
  const pts = profile.map(p => new THREE.Vector2(p[0], p[1]));
  let g = new THREE.LatheGeometry(pts, seg);
  g.rotateX(PI / 2);
  return toCreasedNormals(g, crease);
}
/** 沿路径的变宽臂（夹板 / 主夹板臂）轮廓点 */
function armOutline(pts, w0, w1) {
  const n = pts.length, L = [], R = [], tang = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    tang.push([tx, ty]);
    const nx = -ty, ny = tx, w = lerp(w0, w1, i / (n - 1));
    L.push([pts[i][0] + nx * w, pts[i][1] + ny * w]);
    R.push([pts[i][0] - nx * w, pts[i][1] - ny * w]);
  }
  const out = [...L];
  const cap = (c, t, w, startFrom) => {
    const a0 = Math.atan2(t[0], -t[1]); // 法线 (-ty,tx) 的角度
    const arr = [];
    for (let k = 1; k < 8; k++) { const a = a0 - PI * k / 8 - startFrom; arr.push([c[0] + w * Math.cos(a), c[1] + w * Math.sin(a)]); }
    return arr;
  };
  out.push(...cap(pts[n - 1], tang[n - 1], w1, 0));
  for (let i = n - 1; i >= 0; i--) out.push(R[i]);
  out.push(...cap(pts[0], tang[0], w0, PI));
  return out;
}
/** 二次贝塞尔中心线（可带弧度） */
function bez(a, b, bulge = 0, n = 14) {
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
  const cx = mx - dy / l * bulge * l, cy = my + dx / l * bulge * l;
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    pts.push([u * u * a[0] + 2 * u * t * cx + t * t * b[0], u * u * a[1] + 2 * u * t * cy + t * t * b[1]]);
  }
  return pts;
}

/* ─── 齿轮 ─── */
const MOD = 0.25;
const TOOTH = [[-.36, -1.25], [-.27, -.2], [-.16, .6], [-.09, 1], [.09, 1], [.16, .6], [.27, -.2], [.36, -1.25]];
function gearPts(N, r, m = MOD) {
  const pts = [], D = TAU / N;
  for (let i = 0; i < N; i++) for (const [af, rf] of TOOTH) {
    const a = (i + af) * D, rr = r + rf * m;
    pts.push([rr * Math.cos(a), rr * Math.sin(a)]);
  }
  return pts;
}
function windowPts(n, k, hubR, rimR, sw, rot = 0) {
  const a0 = rot + k * TAU / n, a1 = a0 + TAU / n;
  const dO = Math.asin(sw / 2 / rimR), dI = Math.asin(sw / 2 / hubR), pts = [], S = 4;
  for (let i = 0; i <= S; i++) { const a = lerp(a0 + dO, a1 - dO, i / S); pts.push([rimR * Math.cos(a), rimR * Math.sin(a)]); }
  for (let i = 0; i <= S; i++) { const a = lerp(a1 - dI, a0 + dI, i / S); pts.push([hubR * Math.cos(a), hubR * Math.sin(a)]); }
  return chaikin(pts, 2);
}
function makeGear(N, z0, z1, mat, o = {}) {
  const { hole = 0.35, win = null, bevel = 0.03, phase = 0 } = o;
  const r = N * MOD / 2, holes = [circlePts(hole, hole > 2 ? 120 : 24)];
  if (win) for (let k = 0; k < win.n; k++) holes.push(windowPts(win.n, k, win.hub, win.rim, win.sw, win.rot || 0));
  const m = mkExtrude(gearPts(N, r), holes, z0, z1, mat, bevel);
  m.rotation.z = phase;
  return m;
}
/** 两齿轮啮合：已知 A 的相位，求 B 的相位（齿心对齿隙） */
function meshPhase(Apos, NA, phiA, Bpos, NB) {
  const th = Math.atan2(Bpos[1] - Apos[1], Bpos[0] - Apos[0]);
  const pa = (th - phiA) * NA / TAU;
  return (th + PI) - TAU * (0.5 - pa) / NB;
}

const MAXANI = renderer.capabilities.getMaxAnisotropy();
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = MAXANI;
  return t;
}
/** 日内瓦波纹（Côtes de Genève） */
function genevaTex() {
  const t = canvasTex(256, 16, (g, w, h) => {
    for (let i = 0; i < w; i++) {
      const u = (i / w * 5) % 1, v = Math.sin(u * PI), b = Math.floor(120 + v * 135);
      g.fillStyle = `rgb(${b},${b},${b})`; g.fillRect(i, 0, 1, h);
    }
  });
  t.repeat.set(0.42, 0.42); t.rotation = 0.62;
  return t;
}
/** 珍珠纹（Perlage） */
function perlageTex() {
  const t = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#9a9a9a'; g.fillRect(0, 0, w, h);
    const n = 8, s = w / n;
    for (let j = -1; j <= n; j++) for (let i = -1; i <= n; i++) {
      const cx = (i + (j % 2 ? .5 : 0)) * s, cy = j * s * 0.87 + s * .4;
      const gr = g.createRadialGradient(cx - s * .12, cy - s * .12, 0, cx, cy, s * .6);
      gr.addColorStop(0, '#ffffff'); gr.addColorStop(.55, '#b8b8b8'); gr.addColorStop(1, '#5a5a5a');
      g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, s * .58, 0, TAU); g.fill();
    }
  });
  t.repeat.set(0.2, 0.2);
  return t;
}
function leatherTex() {
  const t = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#7a7a7a'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 5200; i++) {
      const b = 90 + Math.random() * 90 | 0, r = .8 + Math.random() * 2.2;
      g.fillStyle = `rgba(${b},${b},${b},.5)`; g.beginPath(); g.arc(Math.random() * w, Math.random() * h, r, 0, TAU); g.fill();
    }
  });
  t.repeat.set(3, 1.4);
  return t;
}
function radialTex(stops, size = 512) {
  return canvasTex(size, size, (g, w) => {
    const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    stops.forEach(s => gr.addColorStop(s[0], s[1]));
    g.fillStyle = gr; g.fillRect(0, 0, w, w);
  });
}
function brandTex() {
  return canvasTex(1024, 256, (g, w, h) => {
    g.clearRect(0, 0, w, h);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = 'rgba(0,0,0,.9)'; g.shadowBlur = 14;
    g.fillStyle = 'rgba(255,255,255,.94)';
    g.font = '500 92px "Cormorant Garamond","Times New Roman",serif';
    if ('letterSpacing' in g) g.letterSpacing = '26px';
    g.fillText('AETERNA', w / 2 + 13, h * .4);
    g.font = '400 30px "Inter","Helvetica Neue",Arial,sans-serif';
    if ('letterSpacing' in g) g.letterSpacing = '9px';
    g.fillStyle = 'rgba(255,255,255,.75)';
    g.fillText('SKELETON · MANUAL WIND', w / 2 + 5, h * .78);
  }, true);
}

function spiralRibbon(r0, r1, turns, z0, z1, thick, seg = 56) {
  const n = Math.floor(turns * seg), pos = [], nor = [], idx = [];
  const rows = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, a = t * turns * TAU, r = r0 + (r1 - r0) * t, c = Math.cos(a), s = Math.sin(a);
    rows.push([r * c, r * s, (r + thick) * c, (r + thick) * s, c, s]);
  }
  const strip = (fn) => {
    const base = pos.length / 3;
    for (const row of rows) { const [v0, v1] = fn(row); pos.push(...v0.p, ...v1.p); nor.push(...v0.n, ...v1.n); }
    for (let i = 0; i < n; i++) { const a = base + i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  };
  strip(r => [{ p: [r[0], r[1], z1], n: [0, 0, 1] }, { p: [r[2], r[3], z1], n: [0, 0, 1] }]);
  strip(r => [{ p: [r[0], r[1], z0], n: [0, 0, -1] }, { p: [r[2], r[3], z0], n: [0, 0, -1] }]);
  strip(r => [{ p: [r[2], r[3], z0], n: [r[4], r[5], 0] }, { p: [r[2], r[3], z1], n: [r[4], r[5], 0] }]);
  strip(r => [{ p: [r[0], r[1], z0], n: [-r[4], -r[5], 0] }, { p: [r[0], r[1], z1], n: [-r[4], -r[5], 0] }]);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  geo.setIndex(idx);
  return geo;
}

  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'e') toggleExplode(); else if (k === 'l') toggleLabels(); else if (k === 'r') toggleSpin(); else if (k === 'n') toggleNight();
  else if (k === 's') cycleSpeed(); else if (k === 't') cycleWarp(); else if (k === 'w') wind(); else if (k === 'i') setPanel(!state.panel);
  else if (k === 'escape') select(null, false);
  else if (k >= '1' && k <= '4') document.querySelectorAll('.sw')[+k - 1].click();
});

const gAmp = $('#gAmp'), bAmp = $('#bAmp'), gPow = $('#gPow'), bPow = $('#bPow'), gEsc = $('#gEsc'), bEsc = $('#bEsc'), clockEl = $('#clock');
let liveT = 0;
function updateLive(dt) {
  liveT += dt; if (liveT < 0.1) return; liveT = 0;
  const deg = Math.abs(live.theta) * 180 / PI, sp = SPEEDS[state.speedIdx];
  gAmp.textContent = deg.toFixed(0) + '°  /  ±' + (AMP * 180 / PI).toFixed(0) + '°'; bAmp.style.width = (deg / (AMP * 180 / PI) * 100) + '%';
  gPow.textContent = (power * 72).toFixed(1) + ' h  ·  ' + (power * 100).toFixed(0) + '%'; bPow.style.width = power * 100 + '%';
  const rpm = 0.2667 * 60 * sp; gEsc.textContent = rpm.toFixed(1) + ' rpm  ·  ' + (8 * sp).toFixed(1) + ' 拍/秒'; bEsc.style.width = (sp) * 100 + '%';
  const s = Math.floor(simSec) % 86400, h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60, p = n => String(n).padStart(2, '0');
  clockEl.innerHTML = `${p(h)}:${p(m)}:${p(ss)}<small>${h < 12 ? 'AM' : 'PM'}</small>`;
}

/* ════════════════════════════════════════════════════════════════════
   主循环
   ════════════════════════════════════════════════════════════════════ */
let shiftCur = 0;
function updateViewOffset(dt) {
  const W = innerWidth, H = innerHeight;
  const target = (state.panel && W > 900) ? (338 + 44) / 2 : 0;
  shiftCur += (target - shiftCur) * Math.min(1, dt * 4);
  if (Math.abs(shiftCur) > 0.3) camera.setViewOffset(W, H, shiftCur, 0, W, H); else camera.clearViewOffset();
}
function onResize() {
  const W = innerWidth, H = innerHeight;
  renderer.setSize(W, H); composer.setSize(W, H);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  refl.getRenderTarget().setSize(reflW(), reflH());
}
addEventListener('resize', onResize);

const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05); TT += dt; autoIdle += dt;
  const now = performance.now();
  exP += clamp(exTarget - exP, -dt / 2.8, dt / 2.8);
  applyExplode(exP);
  updateMovement(dt);
  if (state.spin) turntable.rotation.y += dt * 0.32;
  root.position.y = Math.sin(TT * 0.7) * 0.25;
  updateLighting(dt);
  updateStrapFade();
  stepTween(now);
  controls.update();
  updateViewOffset(dt);
  if (needPick && !downInfo) { needPick = false; setHover(pickAt(mouseX, mouseY), true); }
  const pu = 0.5 + 0.22 * Math.sin(TT * 5);
  for (const k of ['hover', 'sel']) for (const c of hlCache[k].values()) c.emissiveIntensity = pu;
  turntable.updateMatrixWorld(true); camera.updateMatrixWorld();
  updateLabels();
  updateLive(dt);
  composer.render(dt);
}

/* ─── 开场：零件由爆炸状态飞入装配，镜头缓缓推近 ─── */
applyTheme(0); applyExplode(1); updateMovement(0); onResize();
window.__ready = true;
frame();
setTimeout(() => $('#loader').classList.add('done'), 500);
setTimeout(() => { exTarget = 0; flyView(VIEWS.hero, 5.0); }, 1100);
setTimeout(() => { introDone = true; }, 6200);
</script>
